[package]
name = "eon-dns"
description = "EON DNS: the window and the tray over the local resolver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "eon-dns"
path = "src/main.rs"

# Every dependency is a supply-chain commitment (madde 37).
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
eon-dns-engine = { path = "../engine" }
# The window (madde 2), and the tray: the local resolver keeps answering with
# the window closed.
tauri = { version = "2", features = ["tray-icon"] }
# One window per person: a second start shows the first.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The benchmark's own runtime, and --selftest's.
tokio = { version = "1", features = ["rt-multi-thread", "rt"] }
# --selftest builds DNS messages for its stand-in upstream (the engine's own crate).
hickory-resolver = { version = "0.26", default-features = false }

[target.'cfg(windows)'.dependencies]
# The service that holds the rights to change the system, as WARP's warp-svc.
windows-service = "0.8"

[lints]
workspace = true
