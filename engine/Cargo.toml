[package]
name = "eon-dns-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "EON DNS engine: a local resolver with encrypted upstreams, on-device DNSSEC, filtering and counters."
publish = false

# Every dependency is a supply-chain commitment (madde 37); each says why it is here.
[dependencies]
# The resolver: DNS over HTTPS, TLS and QUIC, and DNSSEC validation back to the
# root, on rustls with ring. The library, not Hickory's own binary (madde 47, costs).
# Certificates are checked against the operating system's own trust store
# (rustls-platform-verifier), so its updates and revocations apply here too.
hickory-resolver = { version = "0.26", features = ["https-ring", "tls-ring", "quic-ring", "dnssec-ring", "rustls-platform-verifier"] }
# The listeners and the resolver's I/O.
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
# Fetching the published filter lists over HTTPS (rustls, no system TLS).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

