name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # The engine on loopback: answers, blocks, rules, a dead upstream, the
      # restore scripts. (`--ignored` adds real DoH/DoT/DNSSEC lookups.)
      - run: cargo test
      # `cargo test` builds the binary only for packages with integration tests.
      - run: cargo build
      - name: Self-test (the resolver end to end on loopback)
        shell: bash
        run: |
          target/debug/eon-dns${{ runner.os == 'Windows' && '.exe' || '' }} --selftest report.txt || { cat report.txt; exit 1; }
          cat report.txt
      # The step that changes the system, for real, where that is harmless: point
      # the runner's adapters at 127.0.0.1, check, then put them back and check
      # they are exactly as before (plan madde 47d).
      - name: Apply and restore the system's DNS (runner only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'eon-dns-system'
          function Snapshot { Get-NetAdapter | Where-Object Status -eq 'Up' | ForEach-Object { "{0}={1}" -f $_.ifIndex, ((Get-DnsClientServerAddress -InterfaceIndex $_.ifIndex -AddressFamily IPv4 -ErrorAction SilentlyContinue).ServerAddresses -join ',') } }
          $before = Snapshot
          & target\debug\eon-dns.exe --system apply --data $d
          if ($LASTEXITCODE -ne 0) { Get-Content (Join-Path $d 'system-error.txt'); exit 1 }
          $during = Snapshot
          Write-Output "before: $before"; Write-Output "during: $during"
          if (-not ($during | Where-Object { $_ -match '=127\.0\.0\.1' })) { Write-Output '::error::apply did not point the adapters at 127.0.0.1'; exit 1 }
          if (-not (Test-Path (Join-Path $d 'system-previous.json'))) { Write-Output '::error::no record of the previous settings'; exit 1 }
          & target\debug\eon-dns.exe --system restore --data $d
          if ($LASTEXITCODE -ne 0) { Get-Content (Join-Path $d 'system-error.txt'); exit 1 }
          $after = Snapshot
          Write-Output "after:  $after"
          if (($before -join ';') -ne ($after -join ';')) { Write-Output '::error::restore did not put the adapters back as they were'; exit 1 }
          if (Test-Path (Join-Path $d 'system-previous.json')) { Write-Output '::error::the record outlived the restore'; exit 1 }
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: "22"
      - name: Drive the real window
        if: runner.os == 'Windows'
        shell: bash
        # EON_DNS_NO_SYSTEM is set by the check: the runner's DNS is never changed.
        run: node tools/ui-check.mjs target/debug/eon-dns.exe shots
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: interface-screenshots
          path: shots
          if-no-files-found: ignore

  invariants:
    name: project invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The interface has no network of its own
        run: |
          if grep -rIn -E '\b(fetch|XMLHttpRequest|WebSocket|EventSource|importScripts)\s*\(' src | grep -vE ':[[:space:]]*(//|/\*|\*)'; then
            echo "::error::the interface is reaching the network directly"
            exit 1
          fi
      - name: Untrusted text never becomes markup
        run: |
          if grep -rIn -E 'innerHTML|outerHTML\s*=|insertAdjacentHTML|document\.write' src; then
            echo "::error::markup from strings -- use textContent"
            exit 1
          fi
      - name: No telemetry (madde 36)
        run: |
          if grep -rIn -iE 'telemetry|analytics|sentry|mixpanel|posthog' src engine/src src-tauri/src src-tauri/Cargo.toml engine/Cargo.toml; then
            echo "::error::telemetry-shaped code found"
            exit 1
          fi
      - name: The log is never written to disk (madde 47c)
        run: |
          if grep -rIn -E 'log\(\)[^;]*(fs::write|File::create)|lookups?\.(txt|json|log)' engine/src src-tauri/src; then
            echo "::error::lookups must stay in memory"
            exit 1
          fi
      - name: Only the plugins decided on
        run: |
          if grep -nE '^\s*tauri-plugin-' src-tauri/Cargo.toml | grep -vE 'tauri-plugin-(single-instance) '; then
            echo "::error::a tauri plugin that was not decided on"
            exit 1
          fi
      - name: The interface reaches no plugin
        run: |
          if grep -nE '"(fs|shell|http|dialog|opener|clipboard-manager|notification):' src-tauri/capabilities/*.json; then
            echo "::error::a plugin permission was granted to the interface"
            exit 1
          fi
      - name: Versions agree
        run: |
          app=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2 | cut -d- -f1)
          conf=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "workspace $app, tauri $conf"
          test "$app" = "$conf"

  deny:
    name: licences · advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check all

  reuse:
    name: licence headers (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  dco:
    name: signed-off commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Every commit must carry Signed-off-by
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::missing Signed-off-by: $(git log -1 --oneline "$sha")"
              missing=1
            fi
          done < <(git rev-list "$base..$head")
          exit $missing
